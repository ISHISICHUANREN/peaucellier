<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>椭圆的像 · 反演不封闭</title>
<style>
  :root {
    --bg: #0e0f13; --panel: #16181f; --line: #2a2e3a; --text: #e6e8ef;
    --muted: #8b92a6; --p: #5f96ff; --ell: #ffd27a; --img: #50dcae; --circle: #6b7896;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; min-height: 100%;
  }
  main { flex: 1 1 auto; position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  aside {
    width: 330px; flex: 0 0 330px; background: var(--panel);
    border-left: 1px solid var(--line); padding: 20px; overflow-y: auto;
  }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .formula {
    background: #101218; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font-family: ui-monospace, Consolas, monospace;
    font-size: 12.5px; color: var(--img); margin-bottom: 16px; line-height: 1.7;
  }
  .group { margin-bottom: 14px; }
  .group label { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .group label b { color: var(--text); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--p); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td { padding: 5px 0; border-bottom: 1px solid #1d2029; color: var(--muted); }
  td:last-child { text-align: right; color: var(--text); font-family: ui-monospace, Consolas, monospace; }
  .ok { color: var(--img) !important; }
  .row { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .row button {
    flex: 1 1 calc(50% - 3px); background: #1e222c; color: var(--text);
    border: 1px solid var(--line); border-radius: 7px; padding: 7px 6px;
    font-size: 11.5px; cursor: pointer; white-space: nowrap;
  }
  .row button:hover { background: #262b37; }
  .tips { margin-top: 16px; color: var(--muted); font-size: 12px; line-height: 1.75; }
  .tips b { color: var(--text); }
  a { color: var(--p); text-decoration: none; }
  @media (max-width: 860px) {
    body { flex-direction: column; }
    main { height: 58vh; flex: none; }
    aside { width: 100%; flex: none; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<main><canvas id="c"></canvas></main>

<aside>
  <h1>椭圆的像</h1>
  <div class="sub">反演之后，圆锥曲线不再是圆锥曲线</div>
  <div class="sub" style="margin:-6px 0 12px">
    <a href="index.html">直线机构</a> · <a href="trammel.html">椭圆规</a>
  </div>

  <div class="formula" id="formula"></div>

  <div class="group">
    <label>椭圆半轴 a<b id="vA"></b></label>
    <input id="sA" type="range" min="0.3" max="2.0" step="0.01" value="1.5">
  </div>
  <div class="group">
    <label>椭圆半轴 b<b id="vB"></b></label>
    <input id="sB" type="range" min="0.2" max="1.6" step="0.01" value="0.8">
  </div>
  <div class="group">
    <label>反演中心 O 的 x<b id="vX"></b></label>
    <input id="sX" type="range" min="-3" max="3" step="0.02" value="2.2">
  </div>
  <div class="group">
    <label>反演中心 O 的 y<b id="vY"></b></label>
    <input id="sY" type="range" min="-2.2" max="2.2" step="0.02" value="0.9">
  </div>
  <div class="group">
    <label>反演半径 ρ<b id="vR"></b></label>
    <input id="sR" type="range" min="0.4" max="2.5" step="0.01" value="1.2">
  </div>

  <table>
    <tr><td>OP</td><td id="oOP">–</td></tr>
    <tr><td>OP′</td><td id="oOPp">–</td></tr>
    <tr><td>OP · OP′（应恒定）</td><td id="oK">–</td></tr>
  </table>

  <div class="row">
    <button id="bOn">O 移到椭圆上</button>
    <button id="bCenter">O 移到椭圆中心</button>
  </div>
  <div class="row">
    <button id="bPause">暂停</button>
    <button id="bReset">恢复默认</button>
  </div>

  <div class="tips">
    <b>看什么</b><br>
    · 金线是椭圆，绿线是它在反演下的像<br>
    · O 在椭圆外 / 内 → 像是**双纽线型的四次曲线**（两个自交点在无穷远）<br>
    · 把 O **移到椭圆上**：椭圆过 O，像会退化——一个尖点被甩到无穷远<br>
    · 把 O 移到**中心**：像还是四次曲线，但变得很对称<br><br>
    <b>为什么重要</b><br>
    反演把「直线 ↔ 圆」封成一个封闭族，但**不封闭圆锥曲线**。椭圆、双曲线、抛物线在反演下会跑出这个家族——这正是它比「圆」更本质的地方。
  </div>
</aside>

<script>
(() => {
  "use strict";
  const state = {
    a: 1.5, b: 0.8, ox: 2.2, oy: 0.9, rho: 1.2, theta: 0, paused: false,
    scale: 110, cx: 0, cy: 0,
  };
  const TAU = Math.PI * 2;
  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");

  const sx = (x) => state.cx + x * state.scale;
  const sy = (y) => state.cy - y * state.scale;
  const k2 = () => state.rho * state.rho;

  function inv(p) {
    const dx = p.x - state.ox, dy = p.y - state.oy;
    const r2 = dx * dx + dy * dy;
    if (r2 < 1e-8) return null;
    return { x: state.ox + dx * k2() / r2, y: state.oy + dy * k2() / r2 };
  }

  function ellipsePt(t) {
    return { x: state.a * Math.cos(t), y: state.b * Math.sin(t) };
  }

  function fit() {
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // 取景：覆盖椭圆、反演圆、像的主要部分
    let xmin = -state.a, xmax = state.a, ymin = -state.b, ymax = state.b;
    const add = (x, y) => {
      xmin = Math.min(xmin, x); xmax = Math.max(xmax, x);
      ymin = Math.min(ymin, y); ymax = Math.max(ymax, y);
    };
    add(state.ox - state.rho, state.oy - state.rho);
    add(state.ox + state.rho, state.oy + state.rho);
    for (let i = 0; i < 240; i++) {
      const q = inv(ellipsePt(TAU * i / 240));
      if (!q) continue;
      if (Math.hypot(q.x, q.y) > 8) continue;
      add(q.x, q.y);
    }
    const wSpan = Math.max(0.001, xmax - xmin), hSpan = Math.max(0.001, ymax - ymin);
    state.scale = Math.min(w / (wSpan * 1.25), h / (hSpan * 1.25));
    state.cx = w / 2 - ((xmin + xmax) / 2) * state.scale;
    state.cy = h / 2 + ((ymin + ymax) / 2) * state.scale;
  }

  function polyPoints(fn, n = 400) {
    const out = [];
    for (let i = 0; i <= n; i++) {
      const p = fn(TAU * i / n);
      if (p) out.push(p);
    }
    return out;
  }

  function draw() {
    const w = cv.clientWidth, h = cv.clientHeight;
    ctx.clearRect(0, 0, w, h);

    // 椭圆
    ctx.strokeStyle = "rgba(255,210,122,.9)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    polyPoints(ellipsePt).forEach((p, i) => (i ? ctx.lineTo(sx(p.x), sy(p.y)) : ctx.moveTo(sx(p.x), sy(p.y))));
    ctx.stroke();

    // 反演圆
    ctx.save();
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = "rgba(107,120,150,.6)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(sx(state.ox), sy(state.oy), state.rho * state.scale, 0, TAU);
    ctx.stroke();
    ctx.restore();

    // 像：分段（遇到奇点断开）
    const pts = [];
    for (let i = 0; i <= 720; i++) {
      const p = ellipsePt(TAU * i / 720);
      const q = inv(p);
      const far = q && Math.hypot(q.x, q.y) < 12;
      if (q && far) pts.push({ p, q });
      else pts.push(null);
    }
    ctx.strokeStyle = "rgba(80,220,174,.9)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    let started = false;
    pts.forEach((item) => {
      if (!item) { started = false; return; }
      const X = sx(item.q.x), Y = sy(item.q.y);
      if (!started) { ctx.moveTo(X, Y); started = true; }
      else ctx.lineTo(X, Y);
    });
    ctx.stroke();

    // 动点与连线
    const p0 = ellipsePt(state.theta);
    const q0 = inv(p0);
    if (q0) {
      ctx.save();
      ctx.setLineDash([3, 4]);
      ctx.strokeStyle = "rgba(255,255,255,.25)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(sx(state.ox), sy(state.oy));
      ctx.lineTo(sx(p0.x), sy(p0.y));
      ctx.stroke();
      ctx.restore();

      ctx.beginPath();
      ctx.arc(sx(q0.x), sy(q0.y), 7, 0, TAU);
      ctx.fillStyle = "#50dcae";
      ctx.fill();
      ctx.fillStyle = "#50dcae";
      ctx.font = "600 14px system-ui, sans-serif";
      ctx.fillText("P′", sx(q0.x) + 10, sy(q0.y) - 22);

      const r0 = Math.hypot(p0.x - state.ox, p0.y - state.oy);
      const r1 = Math.hypot(q0.x - state.ox, q0.y - state.oy);
      document.getElementById("oOP").textContent = r0.toFixed(3);
      document.getElementById("oOPp").textContent = r1.toFixed(3);
      const el = document.getElementById("oK");
      el.textContent = (r0 * r1).toFixed(4) + " (= ρ²)";
      el.className = "ok";
    }

    ctx.beginPath();
    ctx.arc(sx(p0.x), sy(p0.y), 8, 0, TAU);
    ctx.fillStyle = "#5f96ff";
    ctx.fill();
    ctx.fillStyle = "#5f96ff";
    ctx.font = "600 14px system-ui, sans-serif";
    ctx.fillText("P", sx(p0.x) + 10, sy(p0.y) - 22);

    // 中心 O
    ctx.beginPath();
    ctx.arc(sx(state.ox), sy(state.oy), 6, 0, TAU);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.font = "600 14px system-ui, sans-serif";
    ctx.fillText("O", sx(state.ox) - 26, sy(state.oy) + 20);

    document.getElementById("formula").textContent =
      "OP · OP′ = ρ² = " + k2().toFixed(2) + "      O = (" + state.ox.toFixed(2) + ", " + state.oy.toFixed(2) + ")";
  }

  function tick() {
    if (!state.paused) state.theta += 0.008;
    draw();
    requestAnimationFrame(tick);
  }

  const bind = (id, key, out, after) => {
    const el = document.getElementById(id);
    const lab = document.getElementById(out);
    el.value = state[key];
    lab.textContent = state[key].toFixed(2);
    el.addEventListener("input", () => {
      state[key] = parseFloat(el.value);
      lab.textContent = state[key].toFixed(2);
      fit();
      if (after) after();
      draw();
    });
  };

  // O 是否恰在椭圆上（用于显示退化）
  function oOnEllipse() {
    const v = (state.ox * state.ox) / (state.a * state.a) + (state.oy * state.oy) / (state.b * state.b);
    return Math.abs(v - 1) < 0.02;
  }

  bind("sA", "a", "vA");
  bind("sB", "b", "vB");
  bind("sX", "ox", "vX");
  bind("sY", "oy", "vY");
  bind("sR", "rho", "vR");

  document.getElementById("bOn").onclick = () => {
    // 放到椭圆上（取当前角度对应的点，再偏一点避免正好撞上奇点）
    const t = 0.9;
    state.ox = state.a * Math.cos(t);
    state.oy = state.b * Math.sin(t);
    document.getElementById("sX").value = state.ox;
    document.getElementById("sY").value = state.oy;
    document.getElementById("vX").textContent = state.ox.toFixed(2);
    document.getElementById("vY").textContent = state.oy.toFixed(2);
    fit();
    draw();
  };
  document.getElementById("bCenter").onclick = () => {
    state.ox = 0; state.oy = 0;
    document.getElementById("sX").value = 0;
    document.getElementById("sY").value = 0;
    document.getElementById("vX").textContent = "0.00";
    document.getElementById("vY").textContent = "0.00";
    fit();
    draw();
  };
  document.getElementById("bPause").onclick = (ev) => {
    state.paused = !state.paused;
    ev.currentTarget.textContent = state.paused ? "继续" : "暂停";
  };
  document.getElementById("bReset").onclick = () => {
    state.a = 1.5; state.b = 0.8; state.ox = 2.2; state.oy = 0.9; state.rho = 1.2;
    [["sA", "a"], ["sB", "b"], ["sX", "ox"], ["sY", "oy"], ["sR", "rho"]].forEach(([id, key]) => {
      document.getElementById(id).value = state[key];
      document.getElementById("v" + key[0].toUpperCase() + key.slice(1)).textContent = state[key].toFixed(2);
    });
    fit();
  };

  window.addEventListener("resize", fit);
  fit();
  tick();
})();
</script>
</body>
</html>
