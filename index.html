<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Peaucellier 直线机构 · 交互演示</title>
<style>
  :root {
    --bg: #0e0f13;
    --panel: #16181f;
    --line: #2a2e3a;
    --text: #e6e8ef;
    --muted: #8b92a6;
    --bar: #c9cedb;
    --p: #5f96ff;
    --pp: #50dcae;
    --o: #ffffff;
    --a: #ffd27a;
    --bd: #96a0bd;
    --warn: #ff9a76;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex;
    min-height: 100%;
  }
  main { flex: 1 1 auto; position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }

  aside {
    width: 340px;
    flex: 0 0 340px;
    background: var(--panel);
    border-left: 1px solid var(--line);
    padding: 20px 20px 40px;
    overflow-y: auto;
  }
  h1 { font-size: 17px; margin: 0 0 4px; letter-spacing: .3px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
  .formula {
    background: #101218;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 13px;
    color: var(--pp);
    margin-bottom: 18px;
  }
  .group { margin-bottom: 18px; }
  .group label { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .group label b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--p); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td { padding: 5px 0; border-bottom: 1px solid #1d2029; color: var(--muted); }
  td:last-child { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; font-family: ui-monospace, Consolas, monospace; }
  .ok { color: var(--pp) !important; }
  .bad { color: var(--warn) !important; }
  .row { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
  .row button { flex: 1 1 calc(50% - 3px); padding: 7px 6px; font-size: 11.5px; white-space: nowrap; }
  button {
    flex: 1;
    background: #1e222c;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 8px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  button:hover { background: #262b37; }
  .tips { margin-top: 18px; color: var(--muted); font-size: 12px; line-height: 1.75; }
  .tips b { color: var(--text); }
  code { background: #101218; padding: 1px 5px; border-radius: 4px; font-size: 11px; }
  @media (max-width: 860px) {
    body { flex-direction: column; }
    main { height: 62vh; flex: none; }
    aside { width: 100%; flex: none; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<main><canvas id="c"></canvas></main>

<aside>
  <h1>Peaucellier 直线机构</h1>
  <div class="sub">七根杆，把圆周运动变成精确直线</div>

  <div class="formula" id="formula"></div>

  <div class="group">
    <label>OB = OD（长杆）<b id="vL"></b></label>
    <input id="sL" type="range" min="1.8" max="3.4" step="0.01" value="2.6">
  </div>
  <div class="group">
    <label>BP = DP（菱形边）<b id="vS"></b></label>
    <input id="sS" type="range" min="0.6" max="2.4" step="0.01" value="1.9">
  </div>
  <div class="group">
    <label>曲柄半径 R<b id="vR"></b></label>
    <input id="sR" type="range" min="0.6" max="1.6" step="0.01" value="1.0">
  </div>

  <table>
    <tr><td>OP</td><td id="oOP">–</td></tr>
    <tr><td>OP′</td><td id="oOPp">–</td></tr>
    <tr><td>OP · OP′（应恒定）</td><td id="oK">–</td></tr>
    <tr><td>OB / OD（实测）</td><td id="oOB">–</td></tr>
    <tr><td>BP / DP / BP′ / DP′</td><td id="oBP">–</td></tr>
  </table>

  <div class="row">
    <button id="bAuto">自动旋转</button>
    <button id="bFull">强行转满</button>
    <button id="bCurve">焦点曲线</button>
    <button id="bClear">清除轨迹</button>
    <button id="bReset">恢复默认</button>
  </div>

  <div class="tips">
    <b>怎么玩</b><br>
    · 拖动画布上的蓝点 <b>P</b>，它会自动贴着圆走<br>
    · 改 OB / BP，看 P′ 的直线怎么左右移动<br>
    · 把 BP 调到接近 OB，菱形会被压扁——那是机构的奇异位置<br>
    · **强行转满**：不管死区，硬转一整圈。看 P′ 怎么飞出画面、机构怎么张不拢<br>
    · 右下角数值实时验证：杆长永远不变，OP·OP′ 永远等于 k²
  </div>
</aside>

<script>
(() => {
  "use strict";

  // ---------- 状态 ----------
  const state = {
    L: 2.6,          // OB = OD
    S: 1.9,          // 菱形边长
    R: 1.0,          // 曲柄半径，同时 OA = R（保证圆过 O）
    theta: -0.6,     // P 在圆上的参数角
    trace: [],       // P′ 的轨迹
    dragging: false,
    auto: false,
    forceFull: false,
    showCurve: false,
    traceBreak: false,
    scale: 110,
    ox: 0, oy: 0,    // O 的屏幕位置
  };
  const MAX_TRACE = 4000;
  window.__state = state;          // 方便在控制台里改参数、调试
  window.addEventListener("error", (e) => {
    window.__err = (e.message || "error") + " @" + (e.lineno || 0);
  });

  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");

  // ---------- 数学 ----------
  const A = () => ({ x: state.R, y: 0 });
  const k2 = () => state.L * state.L - state.S * state.S;

  function P() {
    const a = A();
    return { x: a.x + state.R * Math.cos(state.theta), y: a.y + state.R * Math.sin(state.theta) };
  }

  // P′ = 反演：OP · OP′ = k²
  function Pinv(p) {
    const r2 = p.x * p.x + p.y * p.y;
    if (r2 < 1e-9) return null;
    const k = k2();
    return { x: p.x * k / r2, y: p.y * k / r2 };
  }

  // B、D：以 O 为圆心 L、以 P 为圆心 S 的两圆交点
  function BD(p) {
    const r = Math.hypot(p.x, p.y);
    if (r < 1e-9) return null;
    const om = (r * r + state.L * state.L - state.S * state.S) / (2 * r);
    const h2 = state.L * state.L - om * om;
    if (h2 < 0) return null;                     // 够不着：机构卡死
    const h = Math.sqrt(h2);
    const ux = p.x / r, uy = p.y / r;
    const mx = ux * om, my = uy * om;
    return {
      B: { x: mx - uy * h, y: my + ux * h },
      D: { x: mx + uy * h, y: my - ux * h },
    };
  }

  // 以 O、P 为焦点的椭圆：|XO| + |XP| = sum（B、D 在这条线上）
  function ellipsePts(p, sum, n = 160) {
    const d = Math.hypot(p.x, p.y);
    const a = sum / 2, c = d / 2;
    const b2 = a * a - c * c;
    if (b2 < 0) return null;
    const b = Math.sqrt(b2);
    const ux = d > 1e-9 ? p.x / d : 1, uy = d > 1e-9 ? p.y / d : 0;
    const nx = -uy, ny = ux;
    const cx = p.x / 2, cy = p.y / 2;
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const t = 2 * Math.PI * i / n;
      const ca = a * Math.cos(t), sb = b * Math.sin(t);
      pts.push({ x: cx + ca * ux + sb * nx, y: cy + ca * uy + sb * ny });
    }
    return pts;
  }

  // 以 O、P 为焦点的双曲线：| |XO| − |XP| | = diff（B、D 也在这条线上）
  function hyperPts(p, diff, n = 80) {
    const d = Math.hypot(p.x, p.y);
    const a = diff / 2, c = d / 2;
    const b2 = c * c - a * a;
    if (b2 < 0 || a < 1e-9) return null;
    const b = Math.sqrt(b2);
    const ux = d > 1e-9 ? p.x / d : 1, uy = d > 1e-9 ? p.y / d : 0;
    const nx = -uy, ny = ux;
    const cx = p.x / 2, cy = p.y / 2;
    const out = [[], []];
    for (let s = -1; s <= 1; s += 2) {
      const arr = s < 0 ? out[0] : out[1];
      for (let i = -n; i <= n; i++) {
        const t = (i / n) * 2.0;
        const ch = a * Math.cosh(t), sh = b * Math.sinh(t);
        arr.push({ x: cx + s * ch * ux + sh * nx, y: cy + s * ch * uy + sh * ny });
      }
    }
    return out;
  }

  // ---------- 坐标变换 ----------
  function fit() {
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // 自动取景：覆盖圆、直线、P′ 的可能范围
    const lineX = k2() / (2 * state.R);
    const curveRoom = state.showCurve ? (state.L + state.S) * 0.75 : 0;
    const worldW = Math.max(state.R * 2 + state.R, lineX + state.R * 0.8) + 0.6 + curveRoom;
    const worldH = Math.max(state.R * 2.2, 3.2) + curveRoom;
    state.scale = Math.min(w / (worldW * 2.2), h / (worldH * 1.5));
    state.ox = w * (state.showCurve ? 0.5 : 0.34);
    state.oy = h * 0.54;
  }

  const sx = (x) => state.ox + x * state.scale;
  const sy = (y) => state.oy - y * state.scale;

  // ---------- 绘制 ----------
  function draw() {
    const w = cv.clientWidth, h = cv.clientHeight;
    ctx.clearRect(0, 0, w, h);

    const p = P();
    const q = Pinv(p);
    const bd = BD(p);
    const a = A();
    window.__dead = !bd;

    // 曲柄圆
    ctx.beginPath();
    ctx.arc(sx(a.x), sy(a.y), state.R * state.scale, 0, Math.PI * 2);
    ctx.strokeStyle = "#39415a";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // P′ 的直线
    const lx = k2() / (2 * state.R);
    ctx.beginPath();
    ctx.moveTo(sx(lx), 0);
    ctx.lineTo(sx(lx), h);
    ctx.strokeStyle = "#2f6d5d";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = "#4fbf9d";
    ctx.font = "12px system-ui, sans-serif";
    ctx.fillText("P′ 的轨迹", sx(lx) + 8, h - 14);

    // 轨迹（分段：跨过死区时断开，不画那条假连线）
    if (state.trace.length) {
      ctx.beginPath();
      for (const seg of state.trace) {
        seg.forEach((t, i) => (i ? ctx.lineTo(sx(t.x), sy(t.y)) : ctx.moveTo(sx(t.x), sy(t.y))));
      }
      ctx.strokeStyle = "rgba(80,220,174,.85)";
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }

    if (q && bd) {
      // 焦点曲线：椭圆（和）与双曲线（差），B、D 是它们的交点
    if (state.showCurve) {
      const d = Math.hypot(p.x, p.y);
      const ell = ellipsePts(p, state.L + state.S);
      const hyp = hyperPts(p, Math.abs(state.L - state.S));

      ctx.save();
      ctx.setLineDash([4, 4]);
      ctx.lineWidth = 1.4;
      if (ell) {
        ctx.strokeStyle = "rgba(255,210,122,.5)";
        ctx.beginPath();
        ell.forEach((t, i) => (i ? ctx.lineTo(sx(t.x), sy(t.y)) : ctx.moveTo(sx(t.x), sy(t.y))));
        ctx.stroke();
      }
      if (hyp) {
        ctx.strokeStyle = "rgba(190,150,255,.5)";
        hyp.forEach((branch) => {
          ctx.beginPath();
          branch.forEach((t, i) => (i ? ctx.lineTo(sx(t.x), sy(t.y)) : ctx.moveTo(sx(t.x), sy(t.y))));
          ctx.stroke();
        });
      }
      ctx.restore();

      ctx.font = "12px system-ui, sans-serif";
      ctx.fillStyle = "rgba(255,210,122,.9)";
      ctx.fillText("金：|XO| + |XP| = L+S —— 过 B、D", 24, h - 48);
      ctx.fillStyle = "rgba(190,150,255,.9)";
      ctx.fillText("紫：| |XO| − |XP| | = L−S —— 也过 B、D", 24, h - 28);

      const near = (x, y) => Math.abs(x - y) < 0.03;
      if (near(d, state.L + state.S)) {
        ctx.fillStyle = "#ffd27a";
        ctx.fillText("椭圆已退化成线段（远边界，另一个死点）", 24, h - 68);
      }
      if (near(d, Math.abs(state.L - state.S))) {
        ctx.fillStyle = "#be96ff";
        ctx.fillText("双曲线已退化成射线（近边界，就是死区）", 24, h - 88);
      }
    }

    // 六根约束杆
      const bars = [
        [{ x: 0, y: 0 }, bd.B], [{ x: 0, y: 0 }, bd.D],
        [bd.B, p], [bd.D, p],
        [bd.B, q], [bd.D, q],
      ];
      ctx.strokeStyle = "#c9cedb";
      ctx.lineWidth = 3.5;
      ctx.lineCap = "round";
      bars.forEach(([u, v]) => {
        ctx.beginPath();
        ctx.moveTo(sx(u.x), sy(u.y));
        ctx.lineTo(sx(v.x), sy(v.y));
        ctx.stroke();
      });
      // 第七根：曲柄 AP（人转的那根）
      ctx.strokeStyle = "rgba(95,150,255,.85)";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(sx(a.x), sy(a.y));
      ctx.lineTo(sx(p.x), sy(p.y));
      ctx.stroke();
    }

    // 铰点
    const joint = (pt, color, r, label, dx = 10, dy = -24) => {
      ctx.beginPath();
      ctx.arc(sx(pt.x), sy(pt.y), r, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      if (label) {
        ctx.fillStyle = color;
        ctx.font = "600 14px system-ui, sans-serif";
        ctx.fillText(label, sx(pt.x) + dx, sy(pt.y) + dy);
      }
    };

    joint({ x: 0, y: 0 }, "#ffffff", 7, "O", -26, 22);
    joint(a, "#ffd27a", 7, "A", -8, -18);
    if (bd) {
      joint(bd.B, "#96a0bd", 5, "B");
      joint(bd.D, "#96a0bd", 5, "D", 12, 8);
    }
    if (q) {
      const qx = sx(q.x), qy = sy(q.y);
      if (qx > -60 && qx < w + 60 && qy > -60 && qy < h + 60) {
        joint(q, "#50dcae", 7, "P′");
      } else {
        // P′ 飞出画面：边缘标注
        const ex = Math.min(Math.max(qx, 30), w - 80);
        const ey = Math.min(Math.max(qy, 30), h - 30);
        ctx.fillStyle = "#50dcae";
        ctx.font = "600 15px system-ui, sans-serif";
        ctx.fillText("P′ → ∞", ex, ey);
      }
    }
    joint(p, "#5f96ff", 8, "P");

    // 死区：两圆不相交，机构张不拢
    if (!bd) {
      const r = Math.hypot(p.x, p.y) || 1e-6;
      const om = (r * r + state.L * state.L - state.S * state.S) / (2 * r);
      const gap = Math.max(0, Math.abs(om) - state.L);

      ctx.save();
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = "rgba(255,154,118,.5)";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(sx(0), sy(0), state.L * state.scale, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(sx(p.x), sy(p.y), state.S * state.scale, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = "#ff9a76";
      ctx.font = "600 15px system-ui, sans-serif";
      ctx.fillText("死区：机构张不拢", 24, 32);
      ctx.font = "13px system-ui, sans-serif";
      ctx.fillStyle = "rgba(255,154,118,.9)";
      ctx.fillText("OP = " + r.toFixed(2) + "，杆还差 " + gap.toFixed(2) + " 才够得着", 24, 54);
      ctx.fillStyle = "rgba(255,154,118,.55)";
      ctx.fillText("（虚线圈是两根杆的“能够到”的范围）", 24, 74);
    }
  }

  // ---------- 读数 ----------
  function readout() {
    const p = P();
    const q = Pinv(p);
    const bd = BD(p);
    const rp = Math.hypot(p.x, p.y);

    document.getElementById("oOP").textContent = rp.toFixed(3);
    document.getElementById("oOPp").textContent = q ? Math.hypot(q.x, q.y).toFixed(3) : "∞";
    const prod = q ? rp * Math.hypot(q.x, q.y) : NaN;
    const kEl = document.getElementById("oK");
    kEl.textContent = isFinite(prod) ? prod.toFixed(4) + " (= k²)" : "–";
    kEl.className = isFinite(prod) && Math.abs(prod - k2()) < 1e-6 ? "ok" : "";

    if (bd) {
      const d = (u, v) => Math.hypot(u.x - v.x, u.y - v.y);
      const ob = d({ x: 0, y: 0 }, bd.B), od = d({ x: 0, y: 0 }, bd.D);
      const bp = d(bd.B, p), dp = d(bd.D, p);
      document.getElementById("oOB").textContent = ob.toFixed(3) + " / " + od.toFixed(3);
      document.getElementById("oBP").textContent = [bp, dp].map((v) => v.toFixed(3)).join(" · ") + " …";
      document.getElementById("oOB").className = "ok";
      document.getElementById("oBP").className = "ok";
    } else {
      document.getElementById("oOB").textContent = "— 死区";
      document.getElementById("oBP").textContent = "— 指不到";
      document.getElementById("oOB").className = "bad";
      document.getElementById("oBP").className = "bad";
    }

    document.getElementById("formula").textContent =
      "k² = L² − S² = " + k2().toFixed(3) + "    直线位置 x = k²/(2R) = " + (k2() / (2 * state.R)).toFixed(3);
  }

  // ---------- 循环 ----------
  function tick() {
    window.__frames = (window.__frames || 0) + 1;
    if (state.auto || state.forceFull) {
      state.theta += 0.007;
      if (!state.forceFull && !BD(P())) state.theta += 0.3;   // 普通模式：跳过死区
    }
    // 记录 P′ 轨迹（分段，死区断开）
    const pNow = P();
    const qNow = Pinv(pNow);
    const rNow = Math.hypot(pNow.x, pNow.y);
    if (!BD(pNow) || rNow < 1e-4) {
      state.traceBreak = true;
    } else if (qNow) {
      if (state.traceBreak || !state.trace.length) {
        state.trace.push([]);
        state.traceBreak = false;
      }
      const seg = state.trace[state.trace.length - 1];
      const last = seg[seg.length - 1];
      if (!last || Math.hypot(last.x - qNow.x, last.y - qNow.y) > 1e-4) seg.push(qNow);
      if (seg.length > 3000) seg.shift();
      if (state.trace.length > 40) state.trace.shift();
    }
    draw();
    readout();
    requestAnimationFrame(tick);
  }

  // ---------- 交互 ----------
  function pointerToWorld(ev) {
    const rect = cv.getBoundingClientRect();
    return {
      x: (ev.clientX - rect.left - state.ox) / state.scale,
      y: (state.oy - (ev.clientY - rect.top)) / state.scale,
    };
  }

  cv.addEventListener("pointerdown", (ev) => {
    state.dragging = true;
    cv.classList.add("dragging");
    cv.setPointerCapture(ev.pointerId);
    onDrag(ev);
  });
  cv.addEventListener("pointermove", (ev) => { if (state.dragging) onDrag(ev); });
  cv.addEventListener("pointerup", (ev) => {
    state.dragging = false;
    cv.classList.remove("dragging");
    cv.releasePointerCapture(ev.pointerId);
  });

  // 拖动时把 P 投影到圆上（保持 |AP| = R）
  function onDrag(ev) {
    const w = pointerToWorld(ev);
    const a = A();
    const ang = Math.atan2(w.y - a.y, w.x - a.x);
    if (!state.forceFull) {
      // 避开死区（OP 太小时无解）
      const test = { x: a.x + state.R * Math.cos(ang), y: a.y + state.R * Math.sin(ang) };
      if (Math.hypot(test.x, test.y) < Math.abs(state.L - state.S) + 0.02) return;
    }
    state.theta = ang;
    state.trace.length = 0;
    state.traceBreak = true;
    draw();
    readout();
  }

  // ---------- 控件 ----------
  const bind = (id, key, out, digits = 2) => {
    const el = document.getElementById(id);
    const lab = document.getElementById(out);
    el.value = state[key];
    lab.textContent = state[key].toFixed(digits);
    el.addEventListener("input", () => {
      state[key] = parseFloat(el.value);
      lab.textContent = state[key].toFixed(digits);
      if (state.L <= state.S + 0.05) {         // 保证 k² > 0
        state.S = state.L - 0.05;
        const sS = document.getElementById("sS");
        sS.value = state.S;
        document.getElementById("vS").textContent = state.S.toFixed(2);
      }
      state.trace.length = 0;
      fit();
      draw();
      readout();
    });
  };
  bind("sL", "L", "vL");
  bind("sS", "S", "vS");
  bind("sR", "R", "vR");

  document.getElementById("bFull").onclick = (ev) => {
    state.forceFull = !state.forceFull;
    ev.currentTarget.textContent = state.forceFull ? "退出转满" : "强行转满";
    state.trace.length = 0;
    state.traceBreak = true;
    if (state.forceFull) state.auto = true;
    document.getElementById("bAuto").textContent = state.auto ? "暂停" : "自动旋转";
  };
  document.getElementById("bAuto").onclick = (ev) => {
    state.auto = !state.auto;
    ev.currentTarget.textContent = state.auto ? "暂停" : "自动旋转";
  };
  document.getElementById("bCurve").onclick = (ev) => {
    state.showCurve = !state.showCurve;
    ev.currentTarget.textContent = state.showCurve ? "隐藏曲线" : "焦点曲线";
    fit();
    draw();
    readout();
  };
  document.getElementById("bClear").onclick = () => (state.trace.length = 0);
  document.getElementById("bReset").onclick = () => {
    state.L = 2.6; state.S = 1.9; state.R = 1.0; state.theta = -0.6; state.trace.length = 0;
    ["sL", "sS", "sR"].forEach((id) => {
      const el = document.getElementById(id);
      el.value = state[{ sL: "L", sS: "S", sR: "R" }[id]];
    });
    document.getElementById("vL").textContent = state.L.toFixed(2);
    document.getElementById("vS").textContent = state.S.toFixed(2);
    document.getElementById("vR").textContent = state.R.toFixed(2);
    fit();
  };

  window.addEventListener("resize", fit);
  fit();
  tick();
})();
</script>
</body>
</html>
